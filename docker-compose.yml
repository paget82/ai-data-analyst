services:
  postgres:
    image: postgres:16-alpine
    container_name: data-analyst-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-analyst}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-analyst}
      - POSTGRES_DB=${POSTGRES_DB:-olist}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only run on a completely fresh volume (Postgres's own convention).
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # CSV source files referenced by 02-load-data.sql's COPY commands.
      - ./db/data:/csv-data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analyst} -d ${POSTGRES_DB:-olist}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: data-analyst-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: data-analyst-backend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-analyst}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-analyst}
      - POSTGRES_DB=${POSTGRES_DB:-olist}
      - TZ=${TZ:-Europe/Prague}
    ports:
      # Kept on 5679 by default so an existing VITE_API_URL pointing at
      # http://localhost:5679/webhook/data-analyst-agent keeps working.
      - "${BACKEND_PORT:-5679}:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_API_AUTH_TOKEN: ${API_AUTH_TOKEN}
    container_name: data-analyst-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
